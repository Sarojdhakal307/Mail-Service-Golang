# Production stack. On the server, from the repository root:
#   cp docker/server/docker-compose.prod.yml docker-compose.yml
#   cp docker/server/Dockerfile.prod Dockerfile
#   cp .env.prod .env
#   docker compose up -d --build

services:
  mailservice:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailservice:latest
    env_file:
      - .env
    environment:
      # Inside compose the database is reached by its service name.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      # Bound to localhost: put a reverse proxy (nginx, Caddy) with HTTPS in front.
      # Set BIND_ADDR=0.0.0.0 in .env to expose the port directly instead.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Stored on the host in ./Dockerdata/postgres (relative to the repository root).
      - ./Dockerdata/postgres:/var/lib/postgresql/data
    # No published ports: the database is reachable only from the mailservice container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
