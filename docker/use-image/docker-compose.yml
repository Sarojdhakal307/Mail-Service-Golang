# Runs Mail Service from the published image. No source code or build needed.
# In this folder:
#   cp .env.example .env    (then fill in the secrets)
#   docker compose up -d

services:
  mailservice:
    # Pin a version (e.g. :1.2.3) in production; :latest follows every new release.
    image: ghcr.io/sarojdhakal307/mailservice:${MAILSERVICE_VERSION:-latest}
    env_file:
      - .env
    environment:
      # Inside compose the database is reached by its service name.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      # Bound to localhost: put a reverse proxy (nginx, Caddy) with HTTPS in front.
      # Set BIND_ADDR=0.0.0.0 in .env to expose the port directly instead.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Stored on the host in ./Dockerdata/postgres, next to this file.
      - ./Dockerdata/postgres:/var/lib/postgresql/data
    # No published ports: the database is reachable only from the mailservice container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
